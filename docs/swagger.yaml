basePath: /api
definitions:
  dto.CountByStatus:
    properties:
      count:
        description: Count status
        example: 12
        type: integer
      status:
        description: Status
        example: REVIEWING
        type: string
      type:
        description: 'Type: QUOATATION, PRODUCTION'
        example: QUOTATION
        type: string
    required:
    - count
    - status
    - type
    type: object
  dto.CreatePriceRef:
    type: object
  dto.CreateQuotation:
    properties:
      appointmentAt:
        description: Appointment date (null is now)
        example: 2024-12-00:00:00.0000+07:00
        type: string
      dueDateAt:
        description: Last due date
        example: "2024-12-06"
        type: string
      items:
        description: Quotation product list
        items:
          $ref: '#/definitions/dto.QuotationItem'
        type: array
      remark:
        description: Any remark
        example: remark test
        type: string
      schoolAddress:
        description: School address
        example: Address test
        type: string
      schoolContactName:
        description: School contact name
        example: Sriratch
        type: string
      schoolId:
        description: School id
        example: 2
        type: integer
      schoolName:
        description: School name
        example: School test
        type: string
      schoolTelephone:
        description: School telephone
        example: "0812322212"
        maxLength: 11
        minLength: 9
        type: string
      userId:
        description: Owner uuid
        example: 78705ee5-25cd-45b5-8cb1-63f1cb94e5c8
        type: string
    required:
    - dueDateAt
    - items
    - schoolId
    - schoolName
    - userId
    type: object
  dto.CreateSchool:
    properties:
      address:
        description: Address
        example: 81 test address
        type: string
      contactName:
        description: contact person name
        example: John Doe
        type: string
      name:
        description: Name
        example: school 2
        type: string
      telephone:
        description: Telephone
        example: "0815231112"
        maxLength: 11
        minLength: 9
        type: string
      userId:
        description: UserID
        example: ebf889fd-4f3c-4c15-b44b-1d37cd2ee5e4
        type: string
    required:
    - name
    - userId
    type: object
  dto.CreateUser:
    properties:
      password:
        description: Secure password
        example: Password@1234
        type: string
      storeName:
        description: User's shop name
        example: Example Shop
        type: string
      tierId:
        description: User tier (1,2,3)
        example: 1
        type: integer
      username:
        description: Username
        example: testuser123
        type: string
    required:
    - password
    - storeName
    - tierId
    - username
    type: object
  dto.Login:
    properties:
      password:
        description: Password
        example: Password@123
        minLength: 8
        type: string
      username:
        description: Username
        example: testuser123
        type: string
    required:
    - password
    - username
    type: object
  dto.Option:
    properties:
      color:
        description: Color
        example: "1"
        type: string
      gram:
        description: Gram
        example: 55
        type: integer
      page:
        description: Page
        example: 30
        type: integer
      pattern:
        description: Pattern
        example:
        - SINGLE
        - ' HALF'
        - ' TABLE'
        items:
          type: string
        type: array
      price:
        description: Price
        example: 3.5
        type: number
    type: object
  dto.PriceRefResponse:
    properties:
      categoryId:
        description: Category id
        example: 1
        type: integer
      categoryName:
        description: Category name
        example: รายงาน
        type: string
      options:
        description: List of options
        items:
          $ref: '#/definitions/dto.Option'
        type: array
    type: object
  dto.Production:
    properties:
      id:
        description: Document id
        example: 1
        type: integer
      items:
        description: Related items
        items:
          $ref: '#/definitions/dto.ProductionItem'
        type: array
      remark:
        description: Document remark
        example: test 123
        type: string
    type: object
  dto.ProductionItem:
    properties:
      categoryId:
        description: Category id
        example: 1
        type: integer
      color:
        description: Color (1,4)
        example: "1"
        type: string
      configIds:
        description: Quotation config id list
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      createdAt:
        description: Created date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
      gram:
        description: Notebook grams (40-150)
        example: 40
        type: integer
      hasReference:
        description: Has reference
        example: false
        type: boolean
      id:
        description: Item id
        example: 1
        type: integer
      page:
        description: Page count (30-80)
        example: 40
        type: integer
      pattern:
        description: Page pattern
        example: TABLE
        type: string
      plate:
        description: Plate size (LARGE, SMALL)
        example: LARGE
        type: string
      printedContent:
        description: Printed content
        example: TABLE
        type: string
      quantity:
        description: Product quantity
        example: 1000
        type: integer
      status:
        description: Production status
        example: PRINTING
        type: string
      updatedAt:
        description: Updated date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
    type: object
  dto.ProductionItemResponse:
    properties:
      id:
        description: Document id
        example: 1
        type: integer
      itemId:
        description: item id of production
        example: 2
        type: integer
      status:
        description: Document status
        example: DESIGNING
        type: string
    type: object
  dto.ProductionResponse:
    properties:
      appointmentAt:
        description: Appointment date (null is now)
        example: "2024-12-02"
        type: string
      dueDateAt:
        description: Last due date
        example: "2024-12-02"
        type: string
      id:
        description: Document id
        example: 1
        type: integer
      items:
        description: Related items
        items:
          $ref: '#/definitions/dto.ProductionItem'
        type: array
      quotationId:
        description: Quotation id
        example: 1
        type: integer
      remark:
        description: Document remark
        example: test remark
        type: string
      schoolAddress:
        description: School address
        example: 33/33 Sriratch road
        type: string
      schoolContactName:
        description: School contact name
        example: Sriratch
        type: string
      schoolName:
        description: School name
        example: School 1
        type: string
      schoolTelephone:
        description: School telephone
        example: "0812232212"
        type: string
      storeName:
        description: Store name
        example: Notebook store
        type: string
      userId:
        description: Owner uuid
        example: 78705ee5-25cd-45b5-8cb1-63f1cb94e5c8
        type: string
      userName:
        description: User name
        example: adminTest
        type: string
    type: object
  dto.QuotationConfigResponse:
    properties:
      categoryId:
        description: Category id
        example: 2
        type: integer
      categoryKey:
        description: Category key
        example: CUT_NINE
        type: string
      color:
        description: Color
        example: "1"
        type: string
      comparator:
        description: Comparator
        example: LESS_THAN
        type: string
      compareValue:
        description: Compare value
        example: 5000
        type: integer
      description:
        description: Description
        example: test
        type: string
      fixedChargePrice:
        description: Fixed charge price
        example: 500
        type: number
      hasFixedChange:
        description: Has fixed change
        example: false
        type: boolean
      id:
        description: Config id
        example: 2
        type: integer
      key:
        description: Key
        example: Q_CUT_NINE_PRINT_CLR_CHARGES
        type: string
      label:
        description: Label
        example: block gold
        type: string
      level:
        description: Level
        example: quotation_additional_lists
        type: string
      tierIds:
        description: Tier id list
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      type:
        description: Type
        example: CHARGES
        type: string
      unit:
        description: Unit
        example: BAHT
        type: string
      value:
        description: Value
        example: 1000
        type: number
    type: object
  dto.QuotationItem:
    properties:
      categoryId:
        description: Category id
        example: 1
        type: integer
      color:
        description: Color (1,4)
        example: "1"
        type: string
      configIds:
        description: Quotation config id list
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      gram:
        description: Notebook grams (40-150)
        example: 40
        minimum: 5
        type: integer
      hasReference:
        description: Has reference
        example: false
        type: boolean
      id:
        description: Unique id
        example: 2
        type: integer
      page:
        description: Page count (30-80)
        example: 40
        minimum: 10
        type: integer
      pattern:
        description: Page pattern
        example: TABLE
        type: string
      plate:
        description: Plate size (LARGE, SMALL)
        example: LARGE
        type: string
      price:
        description: Product price
        example: 5.5
        minimum: 0
        type: number
      printedContent:
        description: Printed content
        example: TABLE
        type: string
      quantity:
        description: Product quantity
        example: 1000
        minimum: 1
        type: integer
    required:
    - categoryId
    - color
    - gram
    - hasReference
    - page
    - pattern
    - quantity
    type: object
  dto.QuotationResponse:
    properties:
      appointmentAt:
        description: Appointment date (null is now)
        example: "2024-12-02"
        type: string
      createdAt:
        description: Created date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
      dueDateAt:
        description: Last due date
        example: "2024-12-02"
        type: string
      id:
        description: Document id
        example: 1
        type: integer
      items:
        description: Quotation product list
        items:
          $ref: '#/definitions/dto.QuotationItem'
        type: array
      production:
        allOf:
        - $ref: '#/definitions/dto.Production'
        description: Production related
      productionId:
        description: Production id related
        example: 32
        type: integer
      remark:
        description: Document remark
        example: test remark
        type: string
      schoolAddress:
        description: School address
        example: 33/33 Sriratch road
        type: string
      schoolContactName:
        description: School contact name
        example: Sriratch
        type: string
      schoolName:
        description: School name
        example: School 1
        type: string
      schoolTelephone:
        description: School telephone
        example: "0812232212"
        type: string
      status:
        description: Document status (REVIEWING, APPROVED, CANCELED)
        example: REVIEWING
        type: string
      storeName:
        description: Store name
        example: Notebook store
        type: string
      updatedAt:
        description: Latest update date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
      userId:
        description: Owner uuid
        example: 78705ee5-25cd-45b5-8cb1-63f1cb94e5c8
        type: string
      userName:
        description: User name
        example: munggytest
        type: string
    type: object
  dto.ResponseWithToken:
    properties:
      expiredIn:
        description: Token expired in (second)
        example: 3600
        type: integer
      token:
        description: JWT Token
        example: token123
        type: string
    type: object
  dto.SchoolResponse:
    properties:
      address:
        description: address
        example: 22/11 test address
        type: string
      contactName:
        description: contact person name
        example: John Doe
        type: string
      createdAt:
        description: Created user date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
      id:
        description: id
        example: 1
        type: integer
      name:
        description: school name
        example: school 1
        type: string
      telephone:
        description: Telephone
        example: "0815231112"
        type: string
      updatedAt:
        description: Latest update user date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
    type: object
  dto.UpdateQuotation:
    properties:
      items:
        description: Quotation product list
        items:
          $ref: '#/definitions/dto.QuotationItem'
        type: array
      status:
        description: Document status
        example: APPROVED
        type: string
    required:
    - items
    - status
    type: object
  dto.UpdateQuotationItemRequest:
    properties:
      plate:
        description: Plate size (LARGE, SMALL)
        example: LARGE
        type: string
      price:
        description: Product price
        example: 5.5
        type: number
    required:
    - plate
    - price
    type: object
  dto.UpdateQuotationItemResponse:
    properties:
      id:
        description: Item id
        example: 2
        type: integer
      plate:
        description: Plate size (LARGE, SMALL)
        example: LARGE
        type: string
      price:
        description: Product price
        example: 5.5
        type: number
      quotationId:
        description: Quotation id
        example: 2
        type: integer
    type: object
  dto.UpdateStatusItemProduction:
    properties:
      status:
        description: Document status
        example: DESIGNING
        type: string
    type: object
  dto.UpdateUser:
    properties:
      password:
        description: Secure password
        example: Password@1234
        type: string
      storeName:
        description: User's shop name
        example: Example Shop
        type: string
      tierId:
        description: User tier (1,2,3)
        example: 1
        type: integer
      username:
        description: Username
        example: testuser123
        type: string
    required:
    - storeName
    - tierId
    - username
    type: object
  dto.UserResponse:
    properties:
      createdAt:
        description: Created user date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
      id:
        description: UUID generate from database
        example: be40de0f-ba3d-44d8-9c80-023ac23e0b9a
        type: string
      role:
        description: User role (ADMIN, CUSTOMER)
        example: CUSTOMER
        type: string
      storeName:
        description: User's shop name
        example: Test Store
        type: string
      tierId:
        description: User tier (1,2,3)
        example: 1
        type: integer
      updatedAt:
        description: Latest update user date
        example: "2024-12-07T19:04:39.70268+07:00"
        type: string
      username:
        description: Username
        example: testuser1
        type: string
    type: object
  helper.ApiSuccessResponse:
    properties:
      code:
        description: HTTP status
        example: 200
        type: integer
      data:
        description: Returning data
      message:
        description: Return message
        example: Success
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
info:
  contact:
    email: support@tickbook.net
    name: API Support
    url: http://tickbook.net/support
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://tickbook.net/tos
  title: Tickbook API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      operationId: Login
      parameters:
      - description: Login request
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/dto.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseWithToken'
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - login
  /priceRef:
    get:
      consumes:
      - application/json
      operationId: GetPriceRefByUserID
      parameters:
      - description: User's UUID
        in: query
        name: userId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PriceRefResponse'
                  type: array
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - priceReferences
    post:
      consumes:
      - application/json
      operationId: CreatePriceRef
      parameters:
      - description: Create priceRef request
        in: body
        name: createPriceRefDTO
        schema:
          items:
            $ref: '#/definitions/dto.CreatePriceRef'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PriceRefResponse'
                  type: array
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - JwtToken: []
      tags:
      - priceReferences
  /production/{productionId}:
    get:
      consumes:
      - application/json
      operationId: GetProductionByID
      parameters:
      - description: production ID
        in: path
        name: productionId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductionResponse'
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - production
  /production/{productionId}/item/{itemId}:
    put:
      consumes:
      - application/json
      operationId: UpdateStatusProductionByID
      parameters:
      - description: production ID
        in: path
        name: productionId
        type: string
      - description: item ID
        in: path
        name: itemId
        type: string
      - description: Update status item production request
        in: body
        name: UpdateStatusItemProductionDTO
        schema:
          $ref: '#/definitions/dto.UpdateStatusItemProduction'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductionItemResponse'
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - production
  /quotation:
    get:
      consumes:
      - application/json
      operationId: GetAllQuotation
      parameters:
      - in: query
        name: includeProduction
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.QuotationResponse'
                  type: array
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - quotations
    post:
      consumes:
      - application/json
      operationId: CreateQuotation
      parameters:
      - description: Request
        in: body
        name: createQuotationDTO
        schema:
          $ref: '#/definitions/dto.CreateQuotation'
      produces:
      - application/json
      responses:
        "201":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.QuotationResponse'
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - quotations
  /quotation/{quotationId}:
    get:
      consumes:
      - application/json
      operationId: GetQuotationByID
      parameters:
      - description: quotation ID
        in: path
        name: quotationId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.QuotationResponse'
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - quotations
    put:
      consumes:
      - application/json
      operationId: UpdateQuotation
      parameters:
      - description: Quotation id
        in: path
        name: quotationId
        type: integer
      - description: Update quotation request
        in: body
        name: updateQuotationDTO
        schema:
          $ref: '#/definitions/dto.UpdateQuotation'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.QuotationResponse'
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - JwtToken: []
      tags:
      - quotations
  /quotation/{quotationId}/item/{itemId}:
    put:
      consumes:
      - application/json
      operationId: UpdateQuotationItemByID
      parameters:
      - description: Quotation id
        in: path
        name: quotationId
        type: integer
      - description: Item id
        in: path
        name: itemId
        type: integer
      - description: Update quotation item request
        in: body
        name: updateQuotationItemDTO
        schema:
          $ref: '#/definitions/dto.UpdateQuotationItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UpdateQuotationItemResponse'
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - JwtToken: []
      tags:
      - quotations
  /quotation/config:
    get:
      consumes:
      - application/json
      operationId: GetAllConfig
      parameters:
      - in: query
        name: level
        type: string
      - in: query
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.QuotationConfigResponse'
                  type: array
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
      - quotations
  /quotation/stat:
    get:
      consumes:
      - application/json
      operationId: CountQuotationByStatus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helper.ApiSuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CountByStatus'
                  type: array
              type: object
        "400":
          description: Bad request
        "401":
          description: Unauthorized
      security:
      - JwtToken: []
      tags:
